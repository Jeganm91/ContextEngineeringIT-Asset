<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Asset Assistant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232f5496%22/><text x=%2250%22 y=%2266%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22>IT</text></svg>">
<style>
  :root {
    --bg: #f5f6fa; --panel: #ffffff; --border: #e3e6ec; --text: #1a1d29;
    --muted: #6b7280; --accent: #2f5496; --accent-dark: #24406f; --accent-light: #eef2fb;
    --danger: #c0392b; --warn: #b7791f; --ok: #1e7e34;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
  .app { max-width: 900px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
  header { padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 2px rgba(16,24,40,0.04); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .subtitle { font-size: 12px; color: var(--muted); margin-top: 1px; }
  header .badge { font-size: 12px; color: var(--muted); background: var(--accent-light); padding: 5px 12px; border-radius: 14px; white-space: nowrap; }
  #chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
  #chat:empty::before { content: ''; }
  .msg { max-width: 78%; padding: 12px 16px; border-radius: 14px; line-height: 1.55; font-size: 14.5px; white-space: pre-wrap; word-wrap: break-word; animation: rise 0.18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(16,24,40,0.03); }
  .msg.assistant.escalated { border-left: 3px solid var(--warn); }
  .msg.assistant.error { border-left: 3px solid var(--danger); }
  .flags { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .flag { font-size: 11px; padding: 3px 9px; border-radius: 10px; font-weight: 600; letter-spacing: 0.01em; }
  .flag.injection { background: #fdecea; color: var(--danger); }
  .flag.contradiction { background: #fff4e5; color: var(--warn); }
  .flag.escalated { background: #fff4e5; color: var(--warn); }
  .flag.mcp { background: var(--accent-light); color: var(--accent); }
  details.sources { margin-top: 10px; font-size: 13px; }
  details.sources summary { cursor: pointer; color: var(--accent); font-weight: 500; user-select: none; }
  details.sources summary:hover { text-decoration: underline; }
  .source-item { margin-top: 8px; padding: 9px 11px; background: #fafbfc; border: 1px solid var(--border); border-radius: 8px; }
  .source-item .meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  #inputbar { padding: 16px 24px 20px; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 10px; }
  #q { flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 14.5px; outline: none; transition: border-color 0.15s; font-family: inherit; }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  #send { padding: 12px 24px; background: var(--accent); color: #fff; border: none; border-radius: 12px; cursor: pointer; font-size: 14.5px; font-weight: 600; transition: background 0.15s; }
  #send:hover:not(:disabled) { background: var(--accent-dark); }
  #send:disabled { opacity: 0.5; cursor: default; }
  .typing { color: var(--muted); font-style: italic; font-size: 13px; align-self: flex-start; padding-left: 4px; }
  .typing .dots span { animation: blink 1.2s infinite; }
  .typing .dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: #d7dbe3; border-radius: 4px; }
  @media (max-width: 640px) {
    header { padding: 12px 16px; }
    #chat { padding: 16px; }
    #inputbar { padding: 12px 16px 16px; }
    .msg { max-width: 90%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">IT</div>
      <div>
        <h1>IT Asset Management Assistant</h1>
        <div class="subtitle">Software licensing, approvals &amp; pricing</div>
      </div>
    </div>
    <span class="badge" id="session-badge">session: new</span>
  </header>
  <div id="chat"></div>
  <div id="inputbar">
    <input id="q" type="text" placeholder="Ask about software licensing, approvals, or pricing..." autocomplete="off">
    <button id="send">Send</button>
  </div>
</div>
<script>
const chat = document.getElementById('chat');
const qInput = document.getElementById('q');
const sendBtn = document.getElementById('send');
const sessionBadge = document.getElementById('session-badge');
let sessionId = 'sess-' + Math.random().toString(36).slice(2, 10);
sessionBadge.textContent = 'session: ' + sessionId;

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function addMessage(role, text, extra) {
  const div = document.createElement('div');
  div.className = 'msg ' + role + (extra && extra.escalated ? ' escalated' : '') + (extra && extra.error ? ' error' : '');
  div.textContent = text;
  if (extra) {
    const flags = document.createElement('div');
    flags.className = 'flags';
    let any = false;
    if (extra.mcp_used) { flags.innerHTML += '<span class="flag mcp">Live tool used</span>'; any = true; }
    if (extra.injection_flagged) { flags.innerHTML += '<span class="flag injection">Injection attempt detected</span>'; any = true; }
    if (extra.contradictions && extra.contradictions.length) { flags.innerHTML += '<span class="flag contradiction">Source conflict detected</span>'; any = true; }
    if (extra.escalated) { flags.innerHTML += '<span class="flag escalated">Escalated -- not answered</span>'; any = true; }
    if (any) div.appendChild(flags);

    if (extra.citations && extra.citations.length) {
      const det = document.createElement('details');
      det.className = 'sources';
      const sum = document.createElement('summary');
      sum.textContent = extra.citations.length + ' source(s)';
      det.appendChild(sum);
      extra.citations.forEach((c, i) => {
        const s = document.createElement('div');
        s.className = 'source-item';
        const meta = '[' + (i + 1) + '] ' + escapeHtml(c.source || '') +
          (c.status ? ' -- ' + escapeHtml(c.status) : '') +
          (c.effective_date ? ' -- ' + escapeHtml(c.effective_date) : '');
        s.innerHTML = '<div class="meta">' + meta + '</div>' + escapeHtml((c.content || '').slice(0, 220));
        det.appendChild(s);
      });
      div.appendChild(det);
    }
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = 'Assistant is thinking<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;
  return typing;
}

async function sendQuery() {
  const text = qInput.value.trim();
  if (!text) return;
  addMessage('user', text);
  qInput.value = '';
  sendBtn.disabled = true;
  const typing = showTyping();

  try {
    const res = await fetch('/api/query', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query: text, session_id: sessionId})
    });
    const data = await res.json();
    typing.remove();
    addMessage('assistant', data.answer || '(no answer)', {...data, error: res.status >= 400});
  } catch (e) {
    typing.remove();
    addMessage('assistant', 'Request failed: ' + e.message, {error: true});
  }
  sendBtn.disabled = false;
  qInput.focus();
}

sendBtn.addEventListener('click', sendQuery);
qInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendQuery(); });
qInput.focus();
addMessage('assistant', 'Hello. Ask me about software license requests, premium approvals, seat inventory, or current pricing.');
</script>
</body>
</html>
